[package]
name = "egui-shadcn"
version = "0.1.0"
edition = "2024"
authors = ["Pawel Jankiewicz <pjankiewicz@gmail.com>"]
description = "shadcn/ui-inspired widget library for egui — buttons, inputs, selects, dialogs, and 50+ more components with light/dark theming"
license = "MIT"
repository = "https://github.com/pjankiewicz/egui-shadcn"
homepage = "https://github.com/pjankiewicz/egui-shadcn"
keywords = ["egui", "ui", "widgets", "shadcn", "gui"]
categories = ["gui", "rendering"]
readme = "README.md"
include = [
    "/src/**/*",
    "/assets/**/*",
    "/examples/**/*",
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
]

[lib]
name = "egui_shadcn"
path = "src/lib.rs"

[lints.clippy]
# The crate is deliberately one public item per file, so every `widgets/foo/`
# contains a `foo.rs`. Restructuring all 249 files to satisfy this would cost
# cheap rebases onto upstream for no reader benefit. Everything else clippy
# reports here is fixed rather than silenced.
module_inception = "allow"

# Vendored fork — see VENDORING.md. `egui`/`eframe` follow the workspace so a
# future egui bump surfaces here as a compile error instead of a silent second
# egui in the dependency graph. `egui_flex` 0.7 is the first release on 0.35.
[dependencies]
egui.workspace = true
egui_flex = "0.7"

[dev-dependencies]
eframe.workspace = true

[[example]]
name = "demo"
path = "examples/demo.rs"

[[example]]
name = "shadcn_demo"
path = "examples/shadcn_demo.rs"

[[example]]
name = "component_dashboard"
path = "examples/component_dashboard.rs"

[[example]]
name = "dashboard"
path = "examples/dashboard.rs"

[[example]]
name = "theme_gallery"
path = "examples/theme_gallery.rs"

